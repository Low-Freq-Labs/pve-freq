name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # Nightly full matrix — catches upstream distro breakage
    - cron: '0 8 * * *'  # 3 AM CDT
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level'
        required: true
        type: choice
        options:
          - smoke
          - full
        default: full

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tier 0: Lint (fast gate — blocks everything) ──────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ruff
        run: pip3 install --break-system-packages ruff==0.15.21 2>/dev/null || pip3 install ruff==0.15.21

      - name: Ruff check
        run: ruff check freq/

  # ── Tier 1: Smoke tests (3 distros — fast PR feedback) ────────────────
  test-smoke:
    name: Smoke · ${{ matrix.os }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'debian:12'
          - 'ubuntu:24.04'
          - 'alpine:3.21'
    container:
      image: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Python and pytest
        shell: sh
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq python3 python3-pip openssh-client openssl rsync
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache python3 py3-pip openssh-client openssl bash rsync
          fi
          pip3 install --break-system-packages pytest build 2>/dev/null || pip3 install pytest build

      - name: Verify Python version
        shell: sh
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info >= (3, 11), f'Python 3.11+ required, got {sys.version}'"

      - name: Install package
        shell: sh
        run: pip3 install --break-system-packages --no-deps . 2>/dev/null || pip3 install --no-deps .

      - name: Prepare hermetic runtime fixture
        shell: sh
        run: |
          rm -rf /tmp/freq-ci-runtime
          cp -R tests/fixtures/ci-runtime /tmp/freq-ci-runtime

      - name: Verify freq --version
        shell: sh
        run: freq --version

      - name: Verify freq doctor --local passes
        shell: sh
        run: freq doctor --local
        env:
          FREQ_DIR: /tmp/freq-ci-runtime

      - name: Verify freq init --dry-run
        shell: sh
        run: freq init --dry-run
        env:
          FREQ_DIR: ${{ github.workspace }}

      - name: Run tests
        shell: sh
        run: |
          pip3 install --break-system-packages pytest-cov 2>/dev/null || pip3 install pytest-cov
          python3 -m pytest tests/ -v --tb=short \
            --cov=freq --cov-report=term-missing --cov-fail-under=36 \
            --junit-xml=test-results.xml
        env:
          FREQ_DIR: /tmp/freq-ci-runtime

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-smoke-${{ strategy.job-index }}
          path: test-results.xml
          retention-days: 30

      - name: Build wheel
        shell: sh
        run: python3 -m build --wheel --outdir dist/

      - name: Install from wheel
        shell: sh
        run: |
          pip3 install --break-system-packages --force-reinstall --no-deps dist/*.whl 2>/dev/null || \
            pip3 install --force-reinstall --no-deps dist/*.whl
          freq --version

  # ── Tier 2: Full matrix (main push + nightly + manual) ────────────────
  test-full:
    name: Full · ${{ matrix.os }}
    needs: lint
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_level == 'full')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          # Trimmed 20->7 (2026-07-11, jarvis): one per libc + package-manager family;
          # drops near-duplicate versions. Nightly/dispatch-full only -> fits free minutes.
          - 'debian:12'                   # Debian stable (primary target)
          - 'ubuntu:24.04'                # Ubuntu LTS
          - 'rockylinux:9'                # RHEL-clone family (rocky/alma/oracle/centos)
          - 'fedora:42'                   # Fedora latest (dnf, newest glibc)
          - 'archlinux:latest'            # Arch (pacman, rolling)
          - 'opensuse/tumbleweed:latest'  # openSUSE (zypper)
          - 'alpine:3.21'                 # Alpine (musl, high-value non-glibc edge)
    container:
      image: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Python and pytest
        shell: sh
        run: |
          # Detect package manager and install Python 3.11+, pip, pytest, openssh, openssl
          if command -v xbps-install >/dev/null 2>&1; then
            # Void Linux
            xbps-install -Sy python3 python3-pip openssh openssl rsync
          elif command -v apt-get >/dev/null 2>&1; then
            # Debian, Ubuntu
            apt-get update -qq
            apt-get install -y -qq python3 python3-pip openssh-client openssl rsync
          elif command -v dnf >/dev/null 2>&1; then
            # RHEL family: Rocky, Alma, Oracle, CentOS Stream, Amazon Linux, Fedora
            if dnf list python3.11-pip >/dev/null 2>&1; then
              # RHEL 8/9 clones — python3.11 from AppStream
              dnf install -y -q python3.11 python3.11-pip openssh-clients openssl rsync
              alternatives --set python3 /usr/bin/python3.11 2>/dev/null || \
                ln -sf /usr/bin/python3.11 /usr/local/bin/python3
              ln -sf /usr/bin/pip3.11 /usr/local/bin/pip3 2>/dev/null || true
            else
              # Fedora, Amazon Linux 2023, or distro with python3 already 3.11+
              dnf install -y -q python3 python3-pip openssh-clients openssl rsync
            fi
          elif command -v yum >/dev/null 2>&1; then
            # Legacy yum (fallback)
            yum install -y python3 python3-pip openssh-clients openssl rsync
          elif command -v pacman >/dev/null 2>&1; then
            # Arch
            pacman -Sy --noconfirm python python-pip openssh openssl rsync
          elif command -v zypper >/dev/null 2>&1; then
            # openSUSE (Tumbleweed + Leap)
            zypper --non-interactive install python3 python3-pip openssh-clients openssl rsync
          elif command -v apk >/dev/null 2>&1; then
            # Alpine (musl) — needs bash for install script tests
            apk add --no-cache python3 py3-pip openssh-client openssl bash rsync
          fi
          # Install pytest + build — handle PEP 668 (externally-managed) gracefully
          pip3 install --break-system-packages pytest build 2>/dev/null || pip3 install pytest build

      - name: Verify Python version
        shell: sh
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info >= (3, 11), f'Python 3.11+ required, got {sys.version}'"

      - name: Install package
        shell: sh
        run: |
          pip3 install --break-system-packages --no-deps . 2>/dev/null || pip3 install --no-deps .

      - name: Prepare hermetic runtime fixture
        shell: sh
        run: |
          rm -rf /tmp/freq-ci-runtime
          cp -R tests/fixtures/ci-runtime /tmp/freq-ci-runtime

      - name: Verify freq --version
        shell: sh
        run: freq --version

      - name: Verify freq doctor --local passes
        shell: sh
        run: freq doctor --local
        env:
          FREQ_DIR: /tmp/freq-ci-runtime

      - name: Verify freq init --dry-run
        shell: sh
        run: freq init --dry-run
        env:
          FREQ_DIR: ${{ github.workspace }}

      - name: Verify freq init --check
        shell: sh
        run: freq init --check || true
        env:
          FREQ_DIR: ${{ github.workspace }}

      - name: Lint
        shell: sh
        run: pip3 install --break-system-packages ruff==0.15.21 2>/dev/null || pip3 install ruff==0.15.21 && ruff check freq/

      - name: Run tests with coverage
        shell: sh
        run: |
          pip3 install --break-system-packages pytest-cov 2>/dev/null || pip3 install pytest-cov
          python3 -m pytest tests/ -v --tb=short \
            --cov=freq --cov-report=term-missing --cov-fail-under=36 \
            --junit-xml=test-results.xml
        env:
          FREQ_DIR: /tmp/freq-ci-runtime

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-full-${{ strategy.job-index }}
          path: test-results.xml
          retention-days: 30

      - name: Verify package data
        shell: sh
        run: |
          python3 -c "from freq.data import get_data_path; p = get_data_path(); assert (p / 'conf-templates' / 'freq.toml.example').exists(), 'Missing package data'"
        env:
          FREQ_DIR: ${{ github.workspace }}

      - name: Build wheel
        shell: sh
        run: python3 -m build --wheel --outdir dist/

      - name: Install from wheel
        shell: sh
        run: |
          pip3 install --break-system-packages --force-reinstall --no-deps dist/*.whl 2>/dev/null || \
            pip3 install --force-reinstall --no-deps dist/*.whl
          freq --version

  # ── Tier 2: Hermetic browser behavior ────────────────────────────────
  e2e:
    name: Browser E2E · Chromium
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install browser harness
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run hermetic dashboard behavior oracle
        run: npm run test:e2e:hermetic

  # ── Ephemeral-lab integration slice (24 fleet/PVE tests vs a hermetic SSH ───
  #    container on the runner). Nightly + dispatch-full ONLY — off the per-push budget.
  integration:
    name: Integration · ephemeral-lab
    needs: lint
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_level == 'full')
    runs-on: ubuntu-latest
    env:
      FREQ_DIR: ${{ github.workspace }}
      EPHEMERAL_LAB_ENGINE: docker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package + pytest
        run: |
          pip3 install --break-system-packages pytest 2>/dev/null || pip3 install pytest
          pip3 install --break-system-packages --no-deps . 2>/dev/null || pip3 install --no-deps .
      - name: Run ephemeral-lab integration slice (container on runner)
        run: tests/ephemeral-lab/run-integration

  # ── Test result annotations (shows failures inline on PRs) ────────────
  test-results:
    name: Test Results
    needs: [test-smoke, test-full]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Download smoke test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-smoke-*
          merge-multiple: false
          path: smoke-results/
        continue-on-error: true

      - name: Download full test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-full-*
          merge-multiple: false
          path: full-results/
        continue-on-error: true

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            smoke-results/**/*.xml
            full-results/**/*.xml
          check_name: Test Results
          comment_mode: always

  # ── Status aggregator (single check for branch protection) ────────────
  all-tests:
    name: All Tests
    needs: [lint, test-smoke, test-full, e2e, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Smoke: ${{ needs.test-smoke.result }}"
          echo "Full: ${{ needs.test-full.result }}"
          echo "Browser E2E: ${{ needs.e2e.result }}"
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"
            exit 1
          fi
          if [[ "${{ needs.test-smoke.result }}" != "success" ]]; then
            echo "❌ Smoke tests failed"
            exit 1
          fi
          # Full tests may be skipped on PRs — that's OK
          if [[ "${{ needs.test-full.result }}" == "failure" ]]; then
            echo "❌ Full matrix failed"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "❌ Browser E2E failed"
            exit 1
          fi
          # Integration is nightly/dispatch-only — skipped on push/PR is OK, fail only on failure
          if [[ "${{ needs.integration.result }}" == "failure" ]]; then
            echo "❌ Ephemeral-lab integration failed"
            exit 1
          fi
          echo "✅ All checks passed"
